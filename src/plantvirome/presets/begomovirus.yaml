# Example preset: begomoviruses. Merge into your project config.
rca: {min_period: 600, max_period: 3500}
diversity: {cluster_identity: 0.91, cluster_min_cover: 0.8}   # ICTV species threshold
genbank:
  origin_motif: TAATATTAC   # nick site TAATATT^AC; numbering starts at "AC"
  origin_offset: 7
  min_orf_aa: 60
  protein_refs: db/begomovirus/refs.faa   # gene names + missing/truncated gene QC (plantvirome download-proteins db/begomovirus/refs.tsv)
  # checkv_db: /path/to/checkv-db-v1.5    # optional CheckV QC; its completeness underestimates begomovirus DNA-A/B
  metadata: {host: Manihot esculenta, country: "TO BE FILLED", collection_date: "TO BE FILLED"}
# Species assignment by DNA-A identity (ICTV: 91 % species, 94 % strain; verify the current
# criteria). Build the references first:
#   plantvirome download-refs --taxon Begomovirus --outdir db/begomovirus
species:
  reference: db/begomovirus/refs.fasta
  taxon: Begomovirus
  species_threshold: 0.91
  strain_threshold: 0.94
