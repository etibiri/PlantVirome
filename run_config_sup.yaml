# SUP-basecalled run 2026-10-16 (flowcell FBE51130, SQK-NBD114-96), cassava RCA virome; barcode48 = blank.
threads: 5
host:
  name: Manihot esculenta
  references:
    - /home/etibiri/genome/cassava/GCA_001659605.2_M.esculenta_v8_genomic.fna   # partial nuclear assembly
    - /home/etibiri/Documents/2026/cassava/db/manihot_chloroplast.fa             # NC_010433.1
  variety_references:
    - /home/etibiri/Documents/2026/cassava/db/manihot_chloroplast.fa
databases:
  viral_protein: /home/etibiri/Documents/2026/cassava/db/refseq_viral/viral_protein.dmnd
  taxdump: /home/etibiri/Documents/2026/cassava/db/refseq_viral/taxdump
qc:
  min_length: 500
  trim_adapters: false    # dorado already trimmed adapters/barcodes (no adapter motif left in the reads)
  min_quality: 10         # SUP basecalling (dna_r10.4.1_e8.2_400bps_sup@v5.2.0)
species:
  reference: /home/etibiri/Documents/2026/cassava/db/begomovirus/refs.fasta
  taxon: Begomovirus
  species_threshold: 0.91
  strain_threshold: 0.94
genbank:
  min_length: 1000            # phi29 artifacts in this run are 300-400 nt; real genomes/satellites are >= 1.3 kb
  origin_motif: TAATATTAC   # begomovirus; contigs of other viruses go to review (origin_not_found)
  origin_offset: 7
  origin_max_mismatch: 1      # tolerate one consensus error in the motif
  orient_by_reference: true   # orient on the best reference strand; the motif then places the origin
  metadata: {host: Manihot esculenta}
diversity:
  exclude_unclassified: true   # leave out contigs with no protein tier and no species call
  blanks: [barcode48]
  blank_ratio: 10
