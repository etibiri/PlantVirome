# Config for the 2026-10-16 MinION run (flowcell FBE51130), cassava RCA virome.
threads: 5
host:
  name: Manihot esculenta
  references:
    - genome/cassava/GCA_001659605.2_M.esculenta_v8_genomic.fna   # partial nuclear assembly
    - db/manihot_chloroplast.fa             # NC_010433.1
  variety_references:
    - db/manihot_chloroplast.fa
databases:
  viral_protein: db/refseq_viral/viral_protein.dmnd
  taxdump: db/refseq_viral/taxdump
qc:
  min_length: 500
  min_quality: 8          # run was basecalled with the "fast" model (mean read Q ~9.9)
species:
  reference: db/begomovirus/refs.fasta
  taxon: Begomovirus
  species_threshold: 0.91
  strain_threshold: 0.94
genbank:
  origin_motif: TAATATTAC   # begomovirus; contigs of other viruses go to review (origin_not_found)
  origin_offset: 7
  origin_max_mismatch: 1      # tolerate one consensus error in the motif
  orient_by_reference: true   # orient on the best reference strand; the motif then places the origin
  metadata: {host: Manihot esculenta}
diversity:
  exclude_unclassified: true   # leave out contigs with no protein tier and no species call
