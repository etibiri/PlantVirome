[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plantvirome"
version = "0.1.0"
description = "Virus-agnostic RCA-Nanopore virome pipeline for plants"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "pydantic>=2.5", "pyyaml>=6", "numpy>=1.26", "scipy>=1.11", "pyrodigal-gv>=0.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
plantvirome = "plantvirome.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_tools: requires external bioinformatics tools on PATH"]
